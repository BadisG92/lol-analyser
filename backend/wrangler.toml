name = "lol-coach-api"
main = "src/index.ts"
compatibility_date = "2025-02-01"

[vars]
ENVIRONMENT = "development"

# Secrets (set via `wrangler secret put`):
# ANTHROPIC_API_KEY

[[kv_namespaces]]
binding = "CACHE"
id = "placeholder-dev-id"
# For local dev, wrangler dev uses --local by default and ignores the id.
# For production deploy, replace "placeholder-dev-id" with a real KV namespace ID
# created via: wrangler kv namespace create CACHE

# Local development preview namespace (used by wrangler dev --remote)
# preview_id = "your-preview-namespace-id"

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "lol-coach-images"
